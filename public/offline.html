<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow — Sin conexión</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F0F12;
      color: #F0EFF8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #17171C;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
    }
    .icon { font-size: 56px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #F0EFF8; }
    p { font-size: 15px; color: #7A7A95; line-height: 1.6; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      background: rgba(224,160,48,0.15);
      border: 1px solid rgba(224,160,48,0.4);
      color: #E0A030;
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .pending {
      background: rgba(124,111,224,0.1);
      border: 1px solid rgba(124,111,224,0.2);
      border-radius: 10px;
      padding: 14px 16px;
      margin: 20px 0;
      font-size: 13px;
      color: #B4A8FF;
      display: none;
    }
    button {
      background: #7C6FE0;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .logo { font-size: 20px; font-weight: 800; color: #7C6FE0; margin-bottom: 32px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">StockFlow</div>
    <div class="icon">📡</div>
    <div class="badge">⚠ Sin conexión a internet</div>
    <h1>Modo sin conexión</h1>
    <p>Podés seguir usando StockFlow. Los cambios que hagas se guardarán localmente.</p>
    <p>Cuando vuelva internet, todo se sincronizará automáticamente.</p>

    <div class="pending" id="pendingInfo">
      <strong id="pendingCount">0</strong> cambios pendientes de sincronizar
    </div>

    <button onclick="tryReconnect()">🔄 Intentar reconectar</button>
    <button onclick="goToDashboard()" style="background: rgba(124,111,224,0.15); color: #7C6FE0; border: 1px solid rgba(124,111,224,0.3); margin-top: 10px;">
      Ir al dashboard
    </button>
  </div>

  <script>
    // Mostrar cambios pendientes desde IndexedDB
    async function showPending() {
      try {
        const db = await new Promise((resolve, reject) => {
          const req = indexedDB.open('stockflow-local', 1)
          req.onsuccess = () => resolve(req.result)
          req.onerror = reject
        })
        const tx = db.transaction('sync_queue', 'readonly')
        const store = tx.objectStore('sync_queue')
        const count = await new Promise(resolve => {
          const req = store.count()
          req.onsuccess = () => resolve(req.result)
        })
        if (count > 0) {
          document.getElementById('pendingInfo').style.display = 'block'
          document.getElementById('pendingCount').textContent = count
        }
      } catch {}
    }

    function tryReconnect() {
      if (navigator.onLine) {
        window.location.href = '/dashboard'
      } else {
        alert('Todavía sin conexión. Verificá tu red e intentá de nuevo.')
      }
    }

    function goToDashboard() {
      window.location.href = '/dashboard'
    }

    // Redirigir automáticamente cuando vuelve internet
    window.addEventListener('online', () => {
      setTimeout(() => { window.location.href = '/dashboard' }, 1000)
    })

    showPending()
  </script>
</body>
</html>
