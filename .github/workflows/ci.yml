# CI de Stockio — valida el codigo antes de que llegue a produccion.
#
# Vercel es el CD (deploya solo al pushear a main). Este workflow es CI puro:
# corre los checks rapidos que atrapan bugs antes del deploy.
#
# Gates BLOQUEANTES (si fallan, el check sale rojo):
#   - typecheck: tsc --noEmit
#   - test: vitest run
#   - lint: eslint (0 errores tras limpiar la deuda; ahora es gate estricto)
#
# No corremos `next build` aca a proposito: Vercel ya lo hace al deployar y
# requiere env vars + token de Sentry. tsc + tests cubren el grueso sin eso.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela runs viejos del mismo branch/PR si se pushea algo nuevo (ahorra minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (bloqueante)
        run: npx tsc --noEmit

      - name: Tests (bloqueante)
        run: npm test

      - name: Lint (bloqueante)
        run: npm run lint
